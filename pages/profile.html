<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#14212C; --ink-700:#2C4356; --slate-500:#5C7285; --slate-300:#9FAEBA;
    --paper-50:#F5F7F9; --paper-0:#FFFFFF;
    --stamp-600:#A9752B;
    --line-200:#E3E7EB;
    --radius-sm:8px; --radius-md:12px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-body); color:var(--ink-900); background:var(--paper-50); }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:var(--font-body); }

  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width:220px; flex-shrink:0; background:var(--ink-900); color:var(--paper-0); display:flex; flex-direction:column; padding:22px 0; }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:0 22px 22px; font-family:var(--font-display); font-weight:600; font-size:16px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:10px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:10px 22px; font-size:13.5px; color:var(--slate-300); border-left:3px solid transparent; cursor:pointer; }
  .nav-item.active{ color:var(--paper-0); background:rgba(255,255,255,.07); border-left-color:var(--stamp-600); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ height:64px; background:var(--paper-0); border-bottom:1px solid var(--line-200); display:flex; align-items:center; padding:0 28px; flex-shrink:0; }
  .breadcrumb{ font-size:13px; color:var(--slate-500); }
  .breadcrumb b{ color:var(--ink-900); }

  .content{ padding:32px; display:flex; justify-content:center; }
  .wrap{ width:100%; max-width:640px; }
  .page-title{ font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 4px; }
  .page-sub{ font-size:13.5px; color:var(--slate-500); margin:0 0 24px; }

  .id-card{ background:var(--paper-0); border:1px solid var(--line-200); border-radius:var(--radius-md); padding:24px; display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .avatar-lg{ width:64px; height:64px; border-radius:50%; background:var(--ink-700); color:var(--paper-0); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; font-family:var(--font-display); flex-shrink:0; }
  .id-name{ font-size:16px; font-weight:600; }
  .id-meta{ font-size:12.5px; color:var(--slate-500); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
  .badge-role{ background:var(--paper-50); border:1px solid var(--line-200); padding:2px 9px; border-radius:999px; font-family:var(--font-mono); font-size:11px; }
  .change-photo{ margin-left:auto; font-size:12.5px; font-weight:600; color:var(--ink-700); cursor:pointer; white-space:nowrap; }

  .panel{ background:var(--paper-0); border:1px solid var(--line-200); border-radius:var(--radius-md); padding:24px; margin-bottom:20px; }
  .panel-title{ font-size:14.5px; font-weight:600; margin:0 0 18px; }

  .field{ margin-bottom:18px; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:6px; }
  .field input{ width:100%; font-size:14px; padding:11px 14px; border:1px solid var(--line-200); border-radius:var(--radius-sm); background:var(--paper-0); color:var(--ink-900); outline:none; }
  .field input:disabled{ background:var(--paper-50); color:var(--slate-500); }
  .field input:focus-visible{ border-color:var(--ink-700); box-shadow:0 0 0 3px rgba(44,67,86,.14); }
  .hint{ font-size:11.5px; color:var(--slate-500); margin-top:5px; }

  .panel-actions{ display:flex; justify-content:flex-end; }
  .btn-primary{ padding:10px 20px; background:var(--ink-900); color:var(--paper-0); border:none; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary:hover{ background:var(--ink-700); }

  @media (max-width:760px){ .sidebar{ display:none; } .row-2{ grid-template-columns:1fr; } .id-card{ flex-wrap:wrap; } }
</style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg width="22" height="22" viewBox="0 0 26 26" fill="none"><path d="M3 9.5C3 8.12 4.12 7 5.5 7H20.5C21.88 7 23 8.12 23 9.5V10.5C21.34 10.5 20 11.84 20 13.5C20 15.16 21.34 16.5 23 16.5V17.5C23 18.88 21.88 20 20.5 20H5.5C4.12 20 3 18.88 3 17.5V16.5C4.66 16.5 6 15.16 6 13.5C6 11.84 4.66 10.5 3 10.5V9.5Z" stroke="#F5F7F9" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 7.5V19.5" stroke="#F5F7F9" stroke-width="1.4" stroke-dasharray="2.5 2.5"/></svg>
      TicketHub
    </div>
    <div class="nav-item">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>
      แดชบอร์ด
    </div>
    <div class="nav-item active">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="6" r="3"/><path d="M3.5 16c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5" stroke-linecap="round"/></svg>
      โปรไฟล์
    </div>
  </aside>

  <div class="main">
    <div class="topbar"><span class="breadcrumb"><b>โปรไฟล์ของฉัน</b></span></div>

    <div class="content">
      <div class="wrap">
        <h1 class="page-title">โปรไฟล์ของฉัน</h1>
        <p class="page-sub">จัดการข้อมูลส่วนตัวและความปลอดภัยของบัญชี</p>

        <div class="id-card">
          <div class="avatar-lg">มก</div>
          <div>
            <div class="id-name">มณีรัตน์ กิจเจริญ</div>
            <div class="id-meta">
              <span class="badge-role">ผู้แจ้งปัญหา</span>
              <span>เข้าร่วมเมื่อ 20 ก.ค. 2569</span>
            </div>
          </div>
          <span class="change-photo">เปลี่ยนรูปโปรไฟล์</span>
        </div>

        <div class="panel">
          <h2 class="panel-title">ข้อมูลส่วนตัว</h2>
          <div class="row-2">
            <div class="field"><label for="fname">ชื่อ</label><input type="text" id="fname" value="มณีรัตน์"></div>
            <div class="field"><label for="lname">นามสกุล</label><input type="text" id="lname" value="กิจเจริญ"></div>
          </div>
          <div class="field">
            <label for="email">อีเมล</label>
            <input type="text" id="email" value="maneerat@organization.com" disabled>
            <div class="hint">ติดต่อผู้ดูแลระบบหากต้องการเปลี่ยนอีเมล</div>
          </div>
          <div class="row-2">
            <div class="field"><label for="phone">เบอร์โทร</label><input type="text" id="phone" value="081-234-5678"></div>
            <div class="field"><label for="dept">แผนก</label><input type="text" id="dept" value="ฝ่ายขาย"></div>
          </div>
          <div class="panel-actions"><button class="btn-primary">บันทึกข้อมูล</button></div>
        </div>

        <div class="panel">
          <h2 class="panel-title">เปลี่ยนรหัสผ่าน</h2>
          <div class="field"><label for="cur-pw">รหัสผ่านปัจจุบัน</label><input type="password" id="cur-pw" placeholder="กรอกรหัสผ่านปัจจุบัน"></div>
          <div class="row-2">
            <div class="field"><label for="new-pw">รหัสผ่านใหม่</label><input type="password" id="new-pw" placeholder="อย่างน้อย 8 ตัวอักษร"></div>
            <div class="field"><label for="cfm-pw">ยืนยันรหัสผ่านใหม่</label><input type="password" id="cfm-pw" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"></div>
          </div>
          <div class="panel-actions"><button class="btn-primary">อัปเดตรหัสผ่าน</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
